<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d">
  <title id="t">blockchain-developer-bootcamp</title>
  <desc id="d">A token exchange, built in class The picture: 5 blocks arrive one by one, each linked to the one before; the shapes are illustration, not data. With reduced motion, the finished picture shows at once.</desc>
  <style>
    /* Motion only for readers who have not asked for less. Outside this block everything is in its finished state. */
    @media (prefers-reduced-motion: no-preference) {
      .draw { stroke-dasharray: 100; animation: draw 2.6s cubic-bezier(.4,0,.2,1) both; }
      .arrive { animation: arrive .5s ease-out both; }
      .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 8s steps(48) 3s infinite; }
      .halo { transform-box: fill-box; transform-origin: center; animation: halo 5s steps(60) 3.6s infinite; }
    }
    @keyframes draw { from { stroke-dashoffset: 100 } to { stroke-dashoffset: 0 } }
    @keyframes arrive { from { opacity: 0 } to { opacity: 1 } }
    @keyframes breathe { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.07) } }
    @keyframes halo { 0% { opacity: .55; transform: scale(1) } 70%, 100% { opacity: 0; transform: scale(2.1) } }
    .halo { opacity: 0 }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#0f3460"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="668" y1="0" x2="1160" y2="0"><stop offset="0.00" stop-color="#804c5a"/><stop offset="0.50" stop-color="#b87082"/><stop offset="1.00" stop-color="#ddb5bf"/></linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="620" y1="0" x2="1200" y2="0"><stop offset="0" stop-color="#b87082" stop-opacity="0"/><stop offset=".35" stop-color="#b87082"/><stop offset="1" stop-color="#ddb5bf"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="260" rx="18"/></clipPath>
    <radialGradient id="ember" gradientUnits="userSpaceOnUse" cx="962" cy="124" r="390"><stop offset="0" stop-color="#800020" stop-opacity=".8"/><stop offset=".6" stop-color="#5c1a2b" stop-opacity=".45"/><stop offset="1" stop-color="#5c1a2b" stop-opacity="0"/></radialGradient>
  </defs>
  <g clip-path="url(#card)">
    <!-- an opaque ground: the same picture on GitHub's light and dark themes -->
    <rect width="1200" height="260" fill="url(#ground)"/>
    <rect width="1200" height="260" fill="url(#ember)"/>
    <g class="arrive" style="animation-delay:0.75s" transform="rotate(7.7 764.8 94.9)" fill="none" stroke-width="2.5"><rect x="740.1" y="87.9" width="26.7" height="14.0" rx="7.0" stroke="#b87082"/><rect x="762.8" y="87.9" width="26.7" height="14.0" rx="7.0" stroke="#ddb5bf"/></g>
    <g class="arrive" style="animation-delay:1.25s" transform="rotate(24.6 864.3 124.3)" fill="none" stroke-width="2.5"><rect x="839.5" y="117.3" width="26.7" height="14.0" rx="7.0" stroke="#b87082"/><rect x="862.3" y="117.3" width="26.7" height="14.0" rx="7.0" stroke="#ddb5bf"/></g>
    <g class="arrive" style="animation-delay:1.75s" transform="rotate(8.7 963.7 154.7)" fill="none" stroke-width="2.5"><rect x="939.0" y="147.7" width="26.7" height="14.0" rx="7.0" stroke="#b87082"/><rect x="961.7" y="147.7" width="26.7" height="14.0" rx="7.0" stroke="#ddb5bf"/></g>
    <g class="arrive" style="animation-delay:2.25s" transform="rotate(-19.8 1063.2 144.4)" fill="none" stroke-width="2.5"><rect x="1038.5" y="137.4" width="26.7" height="14.0" rx="7.0" stroke="#b87082"/><rect x="1061.2" y="137.4" width="26.7" height="14.0" rx="7.0" stroke="#ddb5bf"/></g>
    <g class="arrive" style="animation-delay:0.30s"><rect x="680.0" y="53.2" width="70.1" height="70.1" rx="9.8" fill="#121424" stroke="#b87082" stroke-width="2.5"/><rect x="681.2" y="54.4" width="67.6" height="18.2" rx="7.7" fill="#800020"/><path d="M689.0 84.3h47.0" stroke="#ddb5bf" stroke-width="2" stroke-linecap="round"/><path d="M689.0 97.3h38.4" stroke="#614154" stroke-width="2" stroke-linecap="round"/><path d="M689.0 110.3h50.5" stroke="#614154" stroke-width="2" stroke-linecap="round"/></g>
    <g class="arrive" style="animation-delay:0.80s"><rect x="779.5" y="66.5" width="70.1" height="70.1" rx="9.8" fill="#121424" stroke="#b87082" stroke-width="2.5"/><rect x="780.7" y="67.8" width="67.6" height="18.2" rx="7.7" fill="#800020"/><path d="M788.5 97.7h30.5" stroke="#ddb5bf" stroke-width="2" stroke-linecap="round"/><path d="M788.5 110.7h30.6" stroke="#614154" stroke-width="2" stroke-linecap="round"/><path d="M788.5 123.6h29.7" stroke="#614154" stroke-width="2" stroke-linecap="round"/></g>
