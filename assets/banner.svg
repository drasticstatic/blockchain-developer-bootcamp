    <g class="arrive" style="animation-delay:1.80s"><rect x="978.5" y="127.3" width="70.1" height="70.1" rx="9.8" fill="#121424" stroke="#b87082" stroke-width="2.5"/><rect x="979.7" y="128.5" width="67.6" height="18.2" rx="7.7" fill="#800020"/><path d="M987.5 158.5h38.0" stroke="#ddb5bf" stroke-width="2" stroke-linecap="round"/><path d="M987.5 171.4h51.8" stroke="#614154" stroke-width="2" stroke-linecap="round"/><path d="M987.5 184.4h37.2" stroke="#614154" stroke-width="2" stroke-linecap="round"/></g>
    <g class="arrive" style="animation-delay:2.30s"><rect x="1077.9" y="91.5" width="70.1" height="70.1" rx="9.8" fill="#121424" stroke="#b87082" stroke-width="2.5"/><rect x="1079.2" y="92.7" width="67.6" height="18.2" rx="7.7" fill="#800020"/><path d="M1086.9 122.6h34.4" stroke="#ddb5bf" stroke-width="2" stroke-linecap="round"/><path d="M1086.9 135.6h30.5" stroke="#614154" stroke-width="2" stroke-linecap="round"/><path d="M1086.9 148.6h47.5" stroke="#614154" stroke-width="2" stroke-linecap="round"/></g>
    <circle class="halo" cx="1113.0" cy="126.5" r="43" fill="none" stroke="#ddb5bf" stroke-width="2"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="54.1" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">DappU mentorship</text><text x="56" y="106.2" fill="#fbeef1" font-size="46" font-weight="700" letter-spacing="-.5">blockchain-developer-</text><text x="56" y="157.8" fill="#fbeef1" font-size="46" font-weight="700" letter-spacing="-.5">bootcamp</text><text x="56" y="199.3" fill="#dcd0d6" font-size="23">A token exchange, built in class</text></g>
  </g>
</svg>
